notes: >-
  Minute Media publishes no first-party client SDK for a REST/GraphQL API (the company
  exposes no public developer API). Its one published, first-party distributable package
  is a WordPress plugin for its STN Video (formerly SendtoNews) Online Video Platform, which
  registers STN Video as an oEmbed provider so publishers can embed players. Captured as a
  Package, not an SDK, because it is an embed/oEmbed integration rather than a programmatic
  API client library.
