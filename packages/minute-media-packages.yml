notes: >-
  Minute Media publishes no client SDK for any language on npm, PyPI, RubyGems, Packagist,
  Maven Central, NuGet, crates.io or pkg.go.dev — there is no programmatic API client
  library to install. What it does ship, first-party, is two WordPress plugins that
  integrate publishers with the STN Video platform. One is distributed through the
  WordPress.org registry (which answers with real version metadata); the other is
  distributed only as a zip from stnvideo.com, so it has no registry metadata endpoint and
  its currency has to be read from the plugin header and the zip's Last-Modified. Both are
  recorded as packages, not SDKs: they are CMS integrations, not API client libraries, so
  no `SDKs` pointer is emitted in apis.yml.
