name: Minute Media
description: >-
  Minute Media is a global technology, media, and advertising company that builds and operates
  digital sports and entertainment content brands while licensing publishing and monetization
  technology to third parties. Its owned-and-operated properties include Sports Illustrated,
  The Players' Tribune, 90min, Mental Floss, FanSided, The Big Lead, and DBLTAP, reaching a
  reported 200+ million monthly users. On the technology side it offers the STN Online Video
  Platform (OVP) for video publishing and monetization, a Minute Media SSP for programmatic
  advertising, and ad-management solutions for publishers. Minute Media was surfaced as a
  portfolio company of Battery Ventures and added to the API Evangelist network for enrichment.
  As of this pass the company publishes no public developer portal, API documentation, or
  machine-readable API definitions on its primary web properties.
