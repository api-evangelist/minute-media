apis:
- name: STN Video oEmbed API
  description: >-
    The public oEmbed 1.0 provider endpoint for STN Video (formerly SendtoNews), Minute
    Media's online video platform. A GET with a URL-encoded `url` naming an
    embed.sendtonews.com resource that carries an `SC` share code or an `fk` video key
    returns a type `video` oEmbed payload — provider_name, author_name, title, width,
    height, cache_age and the player `html` — in either JSON or XML. It is unauthenticated
    and CORS-open, and it is the surface Minute Media registers with WordPress through its
    own oEmbed plugin. Verified live with an HTTP 200 on 2026-08-12.
  humanURL: https://www.stnvideo.com/resources/our-wordpress-ovp-plugin/
  baseURL: https://embed.sendtonews.com/services/oembed
  tags:
  - oEmbed
  - Video
  - Embed
  - Media
