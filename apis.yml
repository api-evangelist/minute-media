- name: STN Video Publisher API
  description: >-
    The credential-gated publisher API behind the STN Online Video Platform. Every
    operation is a POST to https://api.sendtonews.com/api/v1/ carrying a `cid` (Company ID)
    and `authcode` (Authentication Code) in the request body; the operations exercised by
    Minute Media's own WordPress Player Selector plugin are auth/verifycode, players,
    categories and stories, the last supporting search, language, category and
    offset/length paging over a publisher's video library. There is no public reference and
    no machine-readable definition; credentials are issued by emailing
    publishers@stnvideo.com. Verified live on 2026-08-12 — an unauthenticated POST returns
    HTTP 422 with a structured validation envelope.
  humanURL: https://www.stnvideo.com/resources/our-wordpress-ovp-plugin/
  baseURL: https://api.sendtonews.com/api/v1/
